<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Bài 8: countGreaterThan</title>
</head>
<body>
  <h2>Bài 8: Hàm countGreaterThan</h2>
  <div id="result"></div>

  <script>
    function countGreaterThan(arr, value) {
      let count = 0;
      for (let i = 0; i < arr.length; i++) {
        if (arr[i] > value) {
          count++;
        }
      }
      return count;
    }

    // Sample usage
    const res1 = countGreaterThan([1, 5, 7, 2, 3], 3); 
    const res2 = countGreaterThan([2, 3, 1, -6, 8], 5); 
    const res3 = countGreaterThan([], 5);              

    document.getElementById("result").innerHTML = `
      <p>countGreaterThan([1, 5, 7, 2, 3], 3) => <b>${res1}</b></p>
      <p>countGreaterThan([2, 3, 1, -6, 8], 5) => <b>${res2}</b></p>
      <p>countGreaterThan([], 5) => <b>${res3}</b></p>
    `;
    console.log(res1, res2, res3);
  </script>
</body>
</html>
