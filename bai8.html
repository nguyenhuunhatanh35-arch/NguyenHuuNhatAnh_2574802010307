<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bai 8: Du doan nghe nghiep</title>
</head>
<body>
    <h2>Du doan nghe nghiep</h2>
    <label for="name">Nhap ten nguoi dung:</label>
    <input type="text" id="name" placeholder="Ho va ten">
    <button onclick="duDoan()">Xem nghe nghiep</button>
    <p id="result"></p>

    <script>
        function duDoan() {
            const name = document.getElementById('name').value.trim();
            const res = document.getElementById('result');
            if (!name) {
                res.innerText = 'Vui long nhap ten!';
                return;
            }
            const jobs = ['Lap trinh vien', 'Bac si', 'Giao vien', 'Phi cong', 'Doanh nhan', 'Hoa si', 'Ca si'];
            const randomJob = jobs[Math.floor(Math.random() * jobs.length)];
            res.innerText = 'Nghe nghiep tuong lai cua ' + name + ' la: ' + randomJob;
        }
    </script>
</body>
</html>
