<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Bài 13: calculateGrade</title>
</head>
<body>
  <h2>Bài 13: Hàm calculateGrade</h2>
  <div id="result"></div>

  <script>
    function calculateGrade(arr) {
      if (!arr || arr.length === 0) return "F";
      let sum = 0;
      for (let i = 0; i < arr.length; i++) {
        sum += arr[i];
      }
      let avg = sum / arr.length;
      
      if (avg >= 90) return "A";
      if (avg >= 80) return "B";
      if (avg >= 70) return "C";
      if (avg >= 60) return "D";
      return "F";
    }

    // Sample usage
    const res1 = calculateGrade([95, 90, 88]); 
    const res2 = calculateGrade([80, 85, 82]); 
    const res3 = calculateGrade([50, 60, 55]); 

    document.getElementById("result").innerHTML = `
      <p>calculateGrade([95, 90, 88]) => <b>${res1}</b></p>
      <p>calculateGrade([80, 85, 82]) => <b>${res2}</b></p>
      <p>calculateGrade([50, 60, 55]) => <b>${res3}</b></p>
    `;
    console.log(res1, res2, res3);
  </script>
</body>
</html>
