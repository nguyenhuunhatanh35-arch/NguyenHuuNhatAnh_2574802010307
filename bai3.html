<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Bài 3: findMin</title>
</head>
<body>
  <h2>Bài 3: Hàm findMin</h2>
  <div id="result"></div>

  <script>
    function findMin(arr) {
      if (arr.length === 0) return null;
      let min = arr[0];
      for (let i = 1; i < arr.length; i++) {
        if (arr[i] < min) {
          min = arr[i];
        }
      }
      return min;
    }

    // Sample usage
    const res = findMin([5, 2, 8, 1, 4]);

    document.getElementById("result").innerHTML = `
      <p>findMin([5, 2, 8, 1, 4]) => <b>${res}</b></p>
    `;
    console.log(res);
  </script>
</body>
</html>
