<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Bài 11: filterEvensAndSum</title>
</head>
<body>
  <h2>Bài 11: Hàm filterEvensAndSum</h2>
  <div id="result"></div>

  <script>
    function filterEvensAndSum(arr) {
      let sum = 0;
      for (let i = 0; i < arr.length; i++) {
        if (arr[i] % 2 === 0) {
          sum += arr[i];
        }
      }
      return sum;
    }

    // Sample usage
    const res1 = filterEvensAndSum([1, 2, 3, 4, 5, 6]);          
    const res2 = filterEvensAndSum([12, 14, 15, 19, 20, 100]);   

    document.getElementById("result").innerHTML = `
      <p>filterEvensAndSum([1, 2, 3, 4, 5, 6]) => <b>${res1}</b></p>
      <p>filterEvensAndSum([12, 14, 15, 19, 20, 100]) => <b>${res2}</b></p>
    `;
    console.log(res1, res2);
  </script>
</body>
</html>
