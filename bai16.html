<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Bài 16: findPairsWithSum</title>
</head>
<body>
  <h2>Bài 16: Hàm findPairsWithSum</h2>
  <div id="result"></div>

  <script>
    function findPairsWithSum(arr, sum) {
      let result = [];
      for (let i = 0; i < arr.length; i++) {
        for (let j = i + 1; j < arr.length; j++) {
          if (arr[i] + arr[j] === sum) {
            result.push([arr[i], arr[j]]);
          }
        }
      }
      return result;
    }

    // Sample usage
    const res = findPairsWithSum([1, 2, 3, 4, 5], 5); 

    document.getElementById("result").innerHTML = `
      <p>findPairsWithSum([1, 2, 3, 4, 5], 5) => <b>${JSON.stringify(res)}</b></p>
    `;
    console.log(res);
  </script>
</body>
</html>
