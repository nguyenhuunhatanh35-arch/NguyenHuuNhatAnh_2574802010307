<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Bài 12: findLongestWord</title>
</head>
<body>
  <h2>Bài 12: Hàm findLongestWord</h2>
  <div id="result"></div>

  <script>
    function findLongestWord(arr) {
      if (arr.length === 0) return "";
      let longest = arr[0];
      for (let i = 1; i < arr.length; i++) {
        if (arr[i].length > longest.length) {
          longest = arr[i];
        }
      }
      return longest;
    }

    // Sample usage
    const res1 = findLongestWord(["apple", "banana", "cherry", "date"]);     
    const res2 = findLongestWord(["hello", "world", "this", "is", "great"]); 

    document.getElementById("result").innerHTML = `
      <p>findLongestWord(["apple", "banana", "cherry", "date"]) => <b>${res1}</b></p>
      <p>findLongestWord(["hello", "world", "this", "is", "great"]) => <b>${res2}</b></p>
    `;
    console.log(res1, res2);
  </script>
</body>
</html>
