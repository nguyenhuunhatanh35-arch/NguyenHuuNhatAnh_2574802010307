<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Bài 10: sumOfSquares</title>
</head>
<body>
  <h2>Bài 10: Hàm sumOfSquares</h2>
  <div id="result"></div>

  <script>
    function sumOfSquares(arr) {
      let sum = 0;
      for (let i = 0; i < arr.length; i++) {
        sum += arr[i] * arr[i];
      }
      return sum;
    }

    // Sample usage
    const res1 = sumOfSquares([1, 2, 3]); 
    const res2 = sumOfSquares([4, 5, 6]); 

    document.getElementById("result").innerHTML = `
      <p>sumOfSquares([1, 2, 3]) => <b>${res1}</b></p>
      <p>sumOfSquares([4, 5, 6]) => <b>${res2}</b></p>
    `;
    console.log(res1, res2);
  </script>
</body>
</html>
