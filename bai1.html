<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Bài 1: findMax</title>
</head>
<body>
  <h2>Bài 1: Hàm findMax</h2>
  <div id="result"></div>

  <script>
    function findMax(arr) {
      if (arr.length === 0) return null;
      let max = arr[0];
      for (let i = 1; i < arr.length; i++) {
        if (arr[i] > max) {
          max = arr[i];
        }
      }
      return max;
    }

    // Sample usage
    const res1 = findMax([1, 3, 5, 7, 9]);      
    const res2 = findMax([10, 20, 30, 40, 50]); 
    const res3 = findMax([-5, -2, -1, -3]);     

    document.getElementById("result").innerHTML = `
      <p>findMax([1, 3, 5, 7, 9]) => <b>${res1}</b></p>
      <p>findMax([10, 20, 30, 40, 50]) => <b>${res2}</b></p>
      <p>findMax([-5, -2, -1, -3]) => <b>${res3}</b></p>
    `;
    console.log(res1, res2, res3);
  </script>
</body>
</html>
