<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Bài 5: sumArray</title>
</head>
<body>
  <h2>Bài 5: Hàm sumArray</h2>
  <div id="result"></div>

  <script>
    function sumArray(arr) {
      let sum = 0;
      for (let i = 0; i < arr.length; i++) {
        sum += arr[i];
      }
      return sum;
    }

    // Sample usage
    const res = sumArray([1, 2, 3, 4, 5]); 

    document.getElementById("result").innerHTML = `
      <p>sumArray([1, 2, 3, 4, 5]) => <b>${res}</b></p>
    `;
    console.log(res);
  </script>
</body>
</html>
