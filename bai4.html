<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Bài 4: countPositiveNumbers</title>
</head>
<body>
  <h2>Bài 4: Hàm countPositiveNumbers</h2>
  <div id="result"></div>

  <script>
    function countPositiveNumbers(arr) {
      let count = 0;
      for (let i = 0; i < arr.length; i++) {
        if (arr[i] > 0) {
          count++;
        }
      }
      return count;
    }

    // Sample usage
    const res = countPositiveNumbers([-1, 2, 3, -4, 5]); 

    document.getElementById("result").innerHTML = `
      <p>countPositiveNumbers([-1, 2, 3, -4, 5]) => <b>${res}</b></p>
    `;
    console.log(res);
  </script>
</body>
</html>
