<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Form trong HTML</h2>
    <table>
        <form>
            <tr>
                <td>
                    <label for="user">Username</label>
                </td>
                <td>
                    <input id="user" type="text" placeholder="Enter username">
                </td>
            </tr>
            <tr> 
                <td>
                    <label for="">Password</label>
                </td>
                <td>
                    <input type="password">
                </td>
            </tr>
            <tr>
                <td><label for="">Web server</label></td>
                <td>
                    <select>
                        <option>Vietnam</option>
                        <option>Singapore</option>
                        <option>US</option>
                    </select>
                </td>
            </tr>
            <tr> 
                <td><label for="">Choose role</label></td>
                <td> 
                    <label><input name="role" type="radio">IT</label> <br>
                    <label><input name="role" type="radio">Dev</label> <br>
                    <label><input name="role" type="radio">BA</label> <br>
                </td>
            </tr>
            <tr>
                <td><label for="">Single Sign-on</label></td>
                <td>
                    <label><input type="checkbox">Mail</label> <br>
                    <label><input type="checkbox">Zalo</label> <br>
                    <label><input type="checkbox">Facebook</label> <br>
                </td>
            </tr>
            <tr> 
                <td><label for="">Choose a file</label></td>
                <td><input type="file"></td>
            </tr>
             <tr>
                <td><label for="">Enter your age</label></td>
                <td><input type="number"></td>
            </tr>
            <tr>
                <td><label for="">Pick a date</label></td>
                <td><input type="date"></td>
            </tr>
            <tr>
                <td>Pick a color</td>
                <td><input type="color"></td>
            </tr>
            <tr>
                <td><label for="">Enter your age</label></td>
                <td><input type="number"></td>
            </tr>
            <tr>
                <td>Introduction</td>
                <td><textarea></textarea></td>

            </tr>
            <tr>
                <td></td>
                <td>
                    <input type="submit" value="Send data">
                    <input type="reset" value="Reset">
                </td>
            </tr>
        </form>
    </table>
</body>
</html>
