<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Bài 7: isAscending</title>
</head>
<body>
  <h2>Bài 7: Hàm isAscending</h2>
  <div id="result"></div>

  <script>
    function isAscending(arr) {
      if (!arr || arr.length <= 1) return false;
      for (let i = 0; i < arr.length - 1; i++) {
        if (arr[i] >= arr[i + 1]) {
          return false;
        }
      }
      return true;
    }

    // Sample usage
    const res1 = isAscending([1, 2, 3, 5]); 
    const res2 = isAscending([5]);          
    const res3 = isAscending([1, 3, 2]);    

    document.getElementById("result").innerHTML = `
      <p>isAscending([1, 2, 3, 5]) => <b>${res1}</b></p>
      <p>isAscending([5]) => <b>${res2}</b></p>
      <p>isAscending([1, 3, 2]) => <b>${res3}</b></p>
    `;
    console.log(res1, res2, res3);
  </script>
</body>
</html>
