<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Bài 14: findMissingNumber</title>
</head>
<body>
  <h2>Bài 14: Hàm findMissingNumber</h2>
  <div id="result"></div>

  <script>
    function findMissingNumber(arr, n) {
      let expectedSum = (n * (n + 1)) / 2;
      let actualSum = 0;
      for (let i = 0; i < arr.length; i++) {
        actualSum += arr[i];
      }
      return expectedSum - actualSum;
    }

    // Sample usage
    const res1 = findMissingNumber([1, 2, 4, 5, 6], 6);       
    const res2 = findMissingNumber([3, 7, 1, 2, 8, 4, 5], 8); 
    const res3 = findMissingNumber([1, 2, 3, 4], 4);          

    document.getElementById("result").innerHTML = `
      <p>findMissingNumber([1, 2, 4, 5, 6], 6) => <b>${res1}</b></p>
      <p>findMissingNumber([3, 7, 1, 2, 8, 4, 5], 8) => <b>${res2}</b></p>
      <p>findMissingNumber([1, 2, 3, 4], 4) => <b>${res3}</b></p>
    `;
    console.log(res1, res2, res3);
  </script>
</body>
</html>
