<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Bài 6: calculateAverage</title>
</head>
<body>
  <h2>Bài 6: Hàm calculateAverage</h2>
  <div id="result"></div>

  <script>
    function calculateAverage(arr) {
      if (!arr || arr.length === 0) return 0;
      let sum = 0;
      for (let i = 0; i < arr.length; i++) {
        sum += arr[i];
      }
      return sum / arr.length;
    }

    // Sample usage
    const res1 = calculateAverage([10, 20, 30, 40, 50]); 
    const res2 = calculateAverage([]); // 0

    document.getElementById("result").innerHTML = `
      <p>calculateAverage([10, 20, 30, 40, 50]) => <b>${res1}</b></p>
      <p>calculateAverage([]) => <b>${res2}</b></p>
    `;
    console.log(res1, res2);
  </script>
</body>
</html>
