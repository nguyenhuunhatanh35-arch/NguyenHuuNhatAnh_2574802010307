<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Bài 2: sumOddNumbers</title>
</head>
<body>
  <h2>Bài 2: Hàm sumOddNumbers</h2>
  <div id="result"></div>

  <script>
    function sumOddNumbers(arr) {
      let sum = 0;
      for (let i = 0; i < arr.length; i++) {
        if (arr[i] % 2 !== 0) {
          sum += arr[i];
        }
      }
      return sum;
    }

    // Sample usage
    const res = sumOddNumbers([1, 2, 3, 4, 5]); 

    document.getElementById("result").innerHTML = `
      <p>sumOddNumbers([1, 2, 3, 4, 5]) => <b>${res}</b></p>
    `;
    console.log(res);
  </script>
</body>
</html>
