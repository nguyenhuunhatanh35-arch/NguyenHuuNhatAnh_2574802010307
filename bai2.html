<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bai 2: Tinh tuoi</title>
</head>
<body>
    <h2>Chuong trinh tinh tuoi</h2>
    <label for="year">Nhap nam sinh:</label>
    <input type="number" id="year" placeholder="">
    <button onclick="tinhTuoi()">Tinh tuoi</button>
    <p id="result"></p>

    <script>
        function tinhTuoi() {
            const val = document.getElementById('year').value;
            const res = document.getElementById('result');
            if (!val) {
                res.innerText = 'Vui long nhap nam sinh!';
                return;
            }
            const birthYear = parseInt(val);
            const currentYear = new Date().getFullYear();
            if (birthYear > currentYear) {
                res.innerText = 'Nam sinh khong hop le!';
            } else {
                res.innerText = `Tuoi hien tai cua ban la: ${currentYear - birthYear} tuoi`;
            }
        }
    </script>
</body>
</html>
