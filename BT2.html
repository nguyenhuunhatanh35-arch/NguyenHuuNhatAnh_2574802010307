<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
        <h2>Registration Form</h2>
    <table>
        <form>
            <tr>
                <td>
                    <label for="user">First Name</label>
                </td>
                <td>
                    <input id="user" type="text" placeholder="Enter First Name">
                </td>
            </tr>
            <tr>
            <td> 
                <label for="user">Last Name</label>
                </td>
                <td>
                    <input id="user" type="text" placeholder="Enter Last Name">
                </td>
                </tr>
             <tr>
            <td> 
                <label for="user">Email</label>
                </td>
                <td>
                    <input id="user" type="text" placeholder="Enter Email Address">
                </td>
                </tr>
                <tr>
                    <td>
                    <label for="">Password</label>
                </td>
                <td>
                    <input type="password">
                </td>
            </tr>
            <tr> 
                <td><label for="user">Gender:</label> <br>
                    <label><input name="role" type="radio">Male</label> <br>
                    <label><input name="role" type="radio">Female</label> <br>
                    <label><input name="role" type="radio">Other</label> <br>
                </td>
            </tr>
             <tr>
                <td><label for="">Age</label></td>
                <td><input type="number" id="user" name="age"></td>
            </tr>
            <tr>
                <td><label for="">Preferences</label> <br>
                    <label><input type="checkbox">Acrylic Painting</label> <br>
                    <label><input type="checkbox">Oil Painting</label> <br>
                    <label><input type="checkbox">Water Color Painting</label> <br>
                </td>
            </tr>
            <tr>
                <td><label for="">Select Occupation</label></td>
                <td>
                <select>
                        <option>Student</option>
                        <option>Teacher</option>
                        <option>Other</option>
                </select>
                </td>
            </tr>
            <tr>
                <td>Bio</td>
                <td><textarea>Share few lines about yourself...</textarea></td>

            </tr>
            <tr>
                <td></td>
                <td>
                    <input type="reset" value="RESET">
                    <input type="submit" value="SUBMIT">
                </td>
            </tr>
        </form>
    </table>
</body>
</html>
